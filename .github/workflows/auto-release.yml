name: Auto Release on Merge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'extension/src/**'
      - 'extension/media/**'
      - 'extension/LICENSE'
      - 'README.md'
      - 'extension/README.md'

permissions:
  contents: write

jobs:
  bump-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: extension
        run: npm install

      - name: Bump patch version
        id: bump
        working-directory: extension
        run: |
          OLD=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version
          NEW=$(node -p "require('./package.json').version")
          echo "OLD=$OLD" >> $GITHUB_OUTPUT
          echo "NEW=$NEW" >> $GITHUB_OUTPUT

      - name: Compile TypeScript
        working-directory: extension
        run: npm run compile

      - name: Package VSIX
        working-directory: extension
        run: |
          npx @vscode/vsce package --no-dependencies
          ls -la *.vsix

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension/package.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.NEW }} [skip ci]"
          git push origin main

      - name: Create GitHub Release
        run: |
          VSIX=$(ls extension/custtr-ai-${{ steps.bump.outputs.NEW }}.vsix 2>/dev/null || ls extension/*.vsix | head -1)
          echo "Uploading: $VSIX"
          gh release create "v${{ steps.bump.outputs.NEW }}" \
            "$VSIX" \
            --title "v${{ steps.bump.outputs.NEW }}" \
            --notes "Release v${{ steps.bump.outputs.NEW }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Update releases/latest.json
        run: |
          VERSION=${{ steps.bump.outputs.NEW }}
          REPO="${{ github.server_url }}/${{ github.repository }}"
          DOWNLOAD="${REPO}/releases/download/v${VERSION}/custtr-ai-${VERSION}.vsix"
          printf '{"version":"%s","downloadUrl":"%s","releaseNotes":"Release v%s"}\n' \
            "$VERSION" "$DOWNLOAD" "$VERSION" > releases/latest.json

      - name: Commit latest.json
        run: |
          git add releases/latest.json
          git diff --staged --quiet || git commit -m "chore: update latest.json to v${{ steps.bump.outputs.NEW }} [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
