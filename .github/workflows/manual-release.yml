name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: extension
        run: npm install

      - name: Bump version
        id: bump
        working-directory: extension
        run: |
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Compile TypeScript
        working-directory: extension
        run: npm run compile

      - name: Package VSIX
        working-directory: extension
        run: |
          npx @vscode/vsce package --no-dependencies
          ls -la *.vsix

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension/package.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.VERSION }} [skip ci]"
          git push origin main

      - name: Create GitHub Release
        run: |
          VSIX=$(ls extension/custtr-ai-${{ steps.bump.outputs.VERSION }}.vsix 2>/dev/null || ls extension/*.vsix | head -1)
          gh release create "v${{ steps.bump.outputs.VERSION }}" \
            "$VSIX" \
            --title "v${{ steps.bump.outputs.VERSION }}" \
            --notes "Release v${{ steps.bump.outputs.VERSION }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Update releases/latest.json
        run: |
          VERSION=${{ steps.bump.outputs.VERSION }}
          REPO="${{ github.server_url }}/${{ github.repository }}"
          DOWNLOAD="${REPO}/releases/download/v${VERSION}/custtr-ai-${VERSION}.vsix"
          printf '{"version":"%s","downloadUrl":"%s","releaseNotes":"Release v%s"}\n' \
            "$VERSION" "$DOWNLOAD" "$VERSION" > releases/latest.json
          git add releases/latest.json
          git diff --staged --quiet || git commit -m "chore: update latest.json to v${VERSION} [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
