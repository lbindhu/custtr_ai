<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#152040"/>
      <stop offset="100%" stop-color="#080C18"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="18" fill="url(#bg)"/>

  <!-- Circuit traces — left side -->
  <line x1="4"   y1="44" x2="26" y2="44" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <line x1="4"   y1="64" x2="26" y2="64" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <line x1="4"   y1="84" x2="26" y2="84" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <!-- Circuit traces — right side -->
  <line x1="102" y1="44" x2="124" y2="44" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <line x1="102" y1="64" x2="124" y2="64" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <line x1="102" y1="84" x2="124" y2="84" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <!-- Circuit traces — top side -->
  <line x1="44"  y1="4"  x2="44"  y2="26" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <line x1="64"  y1="4"  x2="64"  y2="26" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <line x1="84"  y1="4"  x2="84"  y2="26" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <!-- Circuit traces — bottom side -->
  <line x1="44"  y1="102" x2="44"  y2="124" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <line x1="64"  y1="102" x2="64"  y2="124" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>
  <line x1="84"  y1="102" x2="84"  y2="124" stroke="#00D4FF" stroke-width="2" opacity="0.85"/>

  <!-- Pin pads — left -->
  <rect x="2"   y="41" width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <rect x="2"   y="61" width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <rect x="2"   y="81" width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <!-- Pin pads — right -->
  <rect x="120" y="41" width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <rect x="120" y="61" width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <rect x="120" y="81" width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <!-- Pin pads — top -->
  <rect x="41"  y="2"   width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <rect x="61"  y="2"   width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <rect x="81"  y="2"   width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <!-- Pin pads — bottom -->
  <rect x="41"  y="120" width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <rect x="61"  y="120" width="6" height="6" rx="1.5" fill="#00D4FF"/>
  <rect x="81"  y="120" width="6" height="6" rx="1.5" fill="#00D4FF"/>

  <!-- Chip body -->
  <rect x="26" y="26" width="76" height="76" rx="6" fill="#0B1526" stroke="#00D4FF" stroke-width="2.5"/>

  <!-- IC orientation notch (top-left) -->
  <circle cx="33" cy="33" r="4" fill="#080C18" stroke="#00D4FF" stroke-width="1.5"/>

  <!-- Internal die lanes (subtle grid lines) -->
  <line x1="64" y1="28" x2="64" y2="100" stroke="#1A3060" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="64" x2="100" y2="64" stroke="#1A3060" stroke-width="1" opacity="0.6"/>

  <!-- Training monitor / screen (centered at chip centre 64,64) -->
  <rect x="38" y="46" width="52" height="36" rx="4" fill="#080C18" stroke="#00D4FF" stroke-width="2"/>
  <!-- Play button triangle (centred at 64,64) -->
  <polygon points="57,54 57,74 76,64" fill="#00D4FF" filter="url(#glow)"/>
  <!-- Monitor neck -->
  <line x1="64" y1="82" x2="64" y2="89" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Monitor base -->
  <line x1="53" y1="89" x2="75" y2="89" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round"/>

</svg>
