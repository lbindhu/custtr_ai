<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mortarboard top flat diamond -->
  <polygon points="10,42 50,24 90,42 50,60" fill="#00897B"/>
  <!-- Cap body -->
  <rect x="33" y="55" width="34" height="18" rx="1" fill="#00897B"/>
  <!-- White gap between top and body -->
  <polygon points="33,55 67,55 67,58 33,58" fill="#ffffff"/>
  <!-- Tassel cord -->
  <line x1="90" y1="42" x2="90" y2="65" stroke="#00897B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Tassel weight -->
  <rect x="85" y="63" width="10" height="11" rx="2" fill="#00897B"/>
</svg>
